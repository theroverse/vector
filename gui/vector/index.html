<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vector — limpeza cirúrgica</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-brand">
        <span class="titlebar-mark" aria-hidden="true"><img src="assets/vector-mark.svg" alt="" width="14" height="14" /></span>
        <span class="titlebar-text">VECTOR<span class="titlebar-text-dim">.EXE</span></span>
        <span class="titlebar-phase" id="titlebar-phase">auditoria — dados de exemplo</span>
      </div>
      <div class="titlebar-actions">
        <button class="win-btn" id="btn-min" title="Minimizar">&#8211;</button>
        <button class="win-btn win-btn-close" id="btn-close" title="Fechar">&#10005;</button>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" id="sidebar" aria-label="Etapas"></nav>
      <main class="content" id="content"></main>
    </div>

    <footer class="navbar">
      <div class="navbar-status" id="navbar-status"></div>
      <div class="navbar-actions">
        <button class="btn btn-ghost" id="btn-back">Voltar</button>
        <button class="btn btn-primary" id="btn-next">Avançar</button>
      </div>
    </footer>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
