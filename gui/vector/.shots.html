<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Vector</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-brand">
        <span class="titlebar-mark"><img src="assets/vector-mark.svg" alt="" width="14" height="14" /></span>
        <span class="titlebar-text">VECTOR<span class="titlebar-text-dim">.EXE</span></span>
        <span class="titlebar-phase">auditoria — dados de exemplo</span>
      </div>
      <div class="titlebar-actions">
        <button class="win-btn" id="btn-min">&#8211;</button>
        <button class="win-btn win-btn-close" id="btn-close">&#10005;</button>
      </div>
    </header>
    <div class="shell">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="content" id="content"></main>
    </div>
    <footer class="navbar">
      <div class="navbar-status" id="navbar-status"></div>
      <div class="navbar-actions">
        <button class="btn btn-ghost" id="btn-back">Voltar</button>
        <button class="btn btn-primary" id="btn-next">Avançar</button>
      </div>
    </footer>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
  <script>
    /* Captura de tela: o hash escolhe o estado inicial. */
    var view = (location.hash || "#welcome").slice(1);
    if (view === "scan") { go("scan"); }
    else if (view === "evidence") { runScan(); }
    else if (view === "clean") { runScan(); startClean(); }
    else if (view === "clean-sensitive") {
      runScan();
      startClean();
      if (document.getElementById("btn-skip")) document.getElementById("btn-skip").onclick();
      if (document.getElementById("btn-skip")) document.getElementById("btn-skip").onclick();
      if (document.getElementById("btn-skip")) document.getElementById("btn-skip").onclick();
      var inp = document.getElementById("f-transcribe");
      if (inp) { inp.value = "REMOVER " + (state.cleanIndex + 1); }
      if (document.getElementById("btn-transcribe-ok")) {
        document.getElementById("btn-transcribe-ok").onclick();
      }
    }
    else if (view === "sensitive") {
      state.target = "GameSaveBackup";
      runScan();
    }
    else if (view === "done") {
      runScan();
      startClean();
      state.removed = 2;
      state.skipped = 1;
      feedLine("ok", "[REMOVIDO] C:\\Program Files\\LogiDownloadAssistant (simulado)");
      feedLine("ok", "[REMOVIDO] C:\\Users\\demo\\AppData\\Local\\OldChatApp (simulado)");
      feedLine("skip", "[PULADO] C:\\ProgramData\\USOShared");
      go("done");
    }
  </script>
</body>
</html>
